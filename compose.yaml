services:
  aka-only-server:
    build:
      context: .
      args:
        VERSION: ${AKA_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      AKA_VALKEY_ADDR: valkey:6379
      AKA_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?.env に VALKEY_PASSWORD を設定してください}
      AKA_AV_TLS_ADDR: ":8443"
      AKA_AV_PLAIN_ADDR: ${AKA_AV_PLAIN_ADDR:-}
      AKA_AV_TLS_HOSTS: ${AKA_AV_TLS_HOSTS:-localhost,127.0.0.1,aka-only-server}
      AKA_ADMIN_ADDR: ":9443"
      AKA_ADMIN_CLIENTS: ${AKA_ADMIN_CLIENTS:-}
      AKA_ADMIN_TLS_HOSTS: ${AKA_ADMIN_TLS_HOSTS:-localhost,127.0.0.1,aka-only-server}
      AKA_LOG_LEVEL: ${AKA_LOG_LEVEL:-info}
      AKA_LOG_BUFFER: ${AKA_LOG_BUFFER:-1000}
      AKA_AUDIT_MAX: ${AKA_AUDIT_MAX:-10000}
    ports:
      # Docker が公開したポートは ufw の規則を通らない。公開範囲はここのバインド先で制御する。
      - "${AKA_AV_TLS_PUBLISH:-0.0.0.0:8443}:8443"
      - "${AKA_AV_PLAIN_PUBLISH:-127.0.0.1:8080}:8080"
      - "${AKA_ADMIN_PUBLISH:-127.0.0.1:9443}:9443"
    networks:
      - default
      - av

  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    # 払い出した SQN を失わないよう、AOF を書き込みごとに同期する。
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always", "--requirepass", "${VALKEY_PASSWORD}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # 同一ホスト上の別の compose プロジェクト（AKA-RADIUS サーバーや BFF など）が接続するためのネットワーク。
  # 相手側では external として参照し、ホスト名 aka-only-server で接続する。Valkey はこのネットワークに出さない。
  av:
    name: ${AKA_SHARED_NETWORK:-aka-av}

volumes:
  valkey-data:
